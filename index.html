<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stylestripper</title>
    <link rel="stylesheet" href="/style.css" />

    <!-- Mammoth.js for DOCX to HTML -->
    <script src="https://unpkg.com/mammoth@1.7.0/mammoth.browser.min.js"></script>
  </head>
  <body>
    <p>
      Paste your content below or upload a Word (.docx). Inline images will be
      removed.
    </p>
    <div id="errorMsg"></div>
    <!-- Place this above your file input -->
    <div id="dropZone">Drag and drop a Word (.docx) file here</div>
    <input type="file" id="fileInput" accept=".docx" style="display: none" />
    <div id="container">
      <div class="panel">
        <label for="previewArea">Preview</label>
        <div
          id="previewArea"
          contenteditable="true"
          spellcheck="false"
          placeholder="Paste here..."
        ></div>
      </div>
      <div class="panel">
        <label for="outputHtml">HTML</label>
        <textarea id="outputHtml" readonly></textarea>
      </div>
    </div>
    <div style="display: flex; justify-content: center; gap: 10px">
      <button id="title">Title</button>
      <button id="intro">Intro</button>
      <button id="body">Body</button>
      <button id="sdgs">SDGs</button>
    </div>
    <pre id="output"></pre>

    <script type="module" src="script.js"></script>
  </body>
</html>
