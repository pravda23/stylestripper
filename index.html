<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stylestripper</title>
    <link rel="stylesheet" href="/style.css" />

    <!-- Mammoth.js for DOCX to HTML -->
    <script src="https://unpkg.com/mammoth@1.7.0/mammoth.browser.min.js"></script>
  </head>
  <body>
    <h1>Stylestripper</h1>
    <h3>LLM text and HTML formatter for sportanddev CMS</h3>
    <div id="errorMsg"></div>
    <!-- Place this above your file input -->
    <div id="dropZone">
      Drag and drop a Word (.docx) or PDF file here. Inline images will be
      removed.
    </div>
    <input type="file" id="fileInput" accept=".docx" style="display: none" />
    <div id="container">
      <div class="panel">
        <label for="previewArea">Rich text preview</label>
        <div
          id="previewArea"
          contenteditable="true"
          spellcheck="false"
          placeholder="TIP: you can also paste rich text or plain text here"
        ></div>
      </div>
      <div class="panel">
        <label for="outputHtml">HTML preview</label>
        <textarea
          id="outputHtml"
          readonly
          placeholder="HTML will appear here"
        ></textarea>
      </div>
    </div>
    <p>Select what you want the LLM to output:</p>
    <div style="display: flex; justify-content: center; gap: 10px">
      <button id="title">Title</button>
      <button id="intro">Intro</button>
      <button id="sdg">SDGs</button>
      <button id="theme">Themes</button>
      <button id="targetGroup">Target Groups</button>
      <button id="sport">Sports</button>
      <button id="country">Countries</button>
    </div>
    <pre id="output"></pre>

    <script type="module" src="script.js"></script>
  </body>
</html>
